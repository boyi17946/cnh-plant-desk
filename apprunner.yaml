version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm ci --include=dev
      - npm run build
run:
  command: npm start
  network:
    port: 8080
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "8080"
    - name: HOSTNAME
      value: 0.0.0.0
  health_check:
    protocol: HTTP
    path: /api/health
    interval: 10
    timeout: 5
    healthy_threshold: 1
    unhealthy_threshold: 5
