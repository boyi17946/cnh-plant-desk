version: 1.0
runtime: docker
build:
  commands:
    build:
      - echo "Image is built in CI and pushed to ECR"
run:
  command: node server.js
  network:
    port: 8080
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "8080"
    - name: HOSTNAME
      value: 0.0.0.0
  health_check:
    protocol: HTTP
    path: /api/health
    interval: 10
    timeout: 5
    healthy_threshold: 1
    unhealthy_threshold: 5
  instance:
    cpu: 1 vCPU
    memory: 2 GB
